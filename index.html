<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1016">
  <meta name="description" content="Eigenes Chart-Tool im Browser mit Binance-Daten, Zeichenwerkzeugen und eigenen Indikatoren.">
  <title>Chart-Tool</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="symbolBtn" class="symbol-btn" title="Symbol suchen (einfach lostippen)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span id="symbolLabel">BTCUSDT</span>
      </button>
      <div id="tfBar" class="tf-bar" role="toolbar" aria-label="Zeitrahmen"></div>
      <div class="topbar-right">
        <button id="logBtn" class="tb-btn toggle" title="Logarithmische Skala (Alt+L)">Log</button>
        <button id="resetBtn" class="tb-btn" title="Ansicht zurücksetzen (Alt+R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg>
        </button>
        <span id="status" class="status" data-state="connecting" title="Verbindung wird aufgebaut"></span>
      </div>
    </header>

    <nav class="toolbar" aria-label="Werkzeuge">
      <button class="tool-btn active" data-tool="cursor" title="Fadenkreuz / Auswählen (Esc)" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg>
      </button>
      <button class="tool-btn" data-tool="trend" title="Trendlinie (Alt+T)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6"/><circle cx="5" cy="19" r="1.8"/><circle cx="19" cy="5" r="1.8"/></svg>
      </button>
      <button class="tool-btn" data-tool="ray" title="Strahl (Alt+X)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 22 2"/><circle cx="5" cy="19" r="1.8"/><circle cx="12" cy="12" r="1.8"/></svg>
      </button>
      <button class="tool-btn" data-tool="hline" title="Horizontale Linie (Alt+H)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h20"/><circle cx="12" cy="12" r="1.8"/></svg>
      </button>
      <button class="tool-btn" data-tool="vline" title="Vertikale Linie (Alt+V)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20"/><circle cx="12" cy="12" r="1.8"/></svg>
      </button>
      <button class="tool-btn" data-tool="rect" title="Rechteck (Alt+B)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button class="tool-btn" data-tool="text" title="Text (Alt+K)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg>
      </button>
      <button class="tool-btn" data-tool="fib" title="Fibonacci-Retracement (Alt+F)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18M3 9h18M3 13h18M3 20h18"/><path d="M5 20 19 4" stroke-dasharray="2 2"/></svg>
      </button>
      <button class="tool-btn" data-tool="measure" title="Messen (Alt+M)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" data-action="undo" title="Rückgängig (Strg+Z)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      </button>
      <button class="tool-btn" data-action="redo" title="Wiederholen (Strg+Y)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
      </button>
      <button class="tool-btn" data-action="hide" title="Zeichnungen ausblenden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="tool-btn" data-action="clear" title="Alle Zeichnungen dieses Symbols löschen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" data-action="export" title="Sicherung exportieren (JSON)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      </button>
      <button class="tool-btn" data-action="import" title="Sicherung importieren (JSON)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>
      </button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </nav>

    <main class="chart-wrap">
      <div id="chart" class="chart"></div>
      <div id="legend" class="legend" aria-live="off"></div>
      <div id="loading" class="loading" hidden>Lade Daten …</div>
    </main>

    <aside class="sidebar" aria-label="Watchlist">
      <div class="sidebar-head">Watchlist</div>
      <p class="sidebar-note">Watchlist mit Live-Kursen folgt in Schritt 5.</p>
    </aside>
  </div>

  <div id="searchModal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="Symbolsuche">
      <div class="search-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Symbol suchen, z. B. BTC, ETHUSDT, SOL">
        <button id="searchClose" class="icon-btn" title="Schließen (Esc)">✕</button>
      </div>
      <div id="quoteFilter" class="quote-filter"></div>
      <ul id="searchResults" class="search-results" role="listbox"></ul>
      <div class="search-foot">Binance Spot · ↑ ↓ wählen · Enter öffnen · Esc schließen</div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/binance.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/symbols.js"></script>
  <script src="js/drawings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
